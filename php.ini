; PHP Configuration for Unlimited File Uploads
; This file can be used with php-fpm or by setting --php-ini flag
; Note: -1 means unlimited (subject to system limits)

upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 1000

